services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: ${CLI_PROXY_PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
      MANAGEMENT_PASSWORD: admin123
      # Force management panel static path to local custom asset directory.
      MANAGEMENT_STATIC_PATH: /CLIProxyAPI/assets
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      # Keep config mount strict: avoid auto-creating a directory when config.yaml is missing.
      - type: bind
        source: ${CLI_PROXY_CONFIG_PATH:-./config.yaml}
        target: /CLIProxyAPI/config.yaml
        bind:
          create_host_path: false
      - ${CLI_PROXY_ASSETS_PATH:-./assets}:/CLIProxyAPI/assets
      - ${CLI_PROXY_AUTH_PATH:-~/.cliproxyapi}:/root/.cliproxyapi
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
    restart: unless-stopped
