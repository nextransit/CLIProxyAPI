services:
  cli-proxy-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
      MANAGEMENT_PASSWORD: admin123
      # Force management panel static path to local custom asset directory.
      MANAGEMENT_STATIC_PATH: /CLIProxyAPI/assets
      # Force usage statistics snapshot to auth dir (mounted volume) for persistence across rebuilds.
      WRITABLE_PATH: /CLIProxyAPI/.data
      # Go runtime tuning: cap the heap so the process does not balloon to several GB
      # when many concurrent requests allocate short-lived buffers, and trigger GC
      # more aggressively to keep the resident set small. Cap logical CPU usage so
      # the GC does not pull every available vCPU under load.
      # See: https://pkg.go.dev/runtime/debug#SetMemoryLimit
      GOMEMLIMIT: ${GOMEMLIMIT:-512MiB}
      GOGC: ${GOGC:-50}
      GOMAXPROCS: ${GOMAXPROCS:-4}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      # Keep config mount strict: avoid auto-creating a directory when config.yaml is missing.
      - type: bind
        source: ${CLI_PROXY_CONFIG_PATH:-./config.yaml}
        target: /CLIProxyAPI/config.yaml
        bind:
          create_host_path: false
      - ${CLI_PROXY_ASSETS_PATH:-./assets}:/CLIProxyAPI/assets
      - ${CLI_PROXY_AUTH_PATH:-~/.cliproxyapi}:/CLIProxyAPI/.data
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
    restart: unless-stopped
