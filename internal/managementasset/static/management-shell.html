<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIProxyAPI Management Hub</title>
    <style>
        :root {
            --bg: #f5f1ea;
            --panel: #fffdf9;
            --line: #ddd2c5;
            --ink: #1f2933;
            --muted: #5e6b78;
            --accent: #9a3412;
            --accent-soft: #f7e7d5;
            --shadow: 0 24px 80px rgba(34, 25, 15, 0.12);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Avenir Next", "Segoe UI Variable", "PingFang SC", "Hiragino Sans GB", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(154, 52, 18, 0.08), transparent 28%),
                linear-gradient(180deg, #fbf8f2 0%, var(--bg) 100%);
        }

        .shell {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px 18px 28px;
        }

        .hero,
        .frame-shell {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .hero {
            padding: 24px 26px;
            margin-bottom: 16px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 16px 0 8px;
            font-size: clamp(2rem, 4.4vw, 3.6rem);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        .copy {
            max-width: 68rem;
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
        }

        .tabs {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tab {
            border: 1px solid rgba(154, 52, 18, 0.18);
            background: #fff8f2;
            color: var(--accent);
            border-radius: 999px;
            padding: 10px 14px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        .tab.active {
            background: linear-gradient(135deg, #9a3412 0%, #7c2d12 100%);
            color: #fff8f1;
            border-color: transparent;
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
        }

        .frame-shell {
            overflow: hidden;
        }

        iframe {
            display: block;
            width: 100%;
            min-height: calc(100vh - 220px);
            border: 0;
            background: #fff;
        }

        @media (max-width: 720px) {
            .shell {
                padding-inline: 12px;
            }

            .hero,
            .toolbar {
                padding-inline: 16px;
            }

            iframe {
                min-height: calc(100vh - 180px);
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="hero">
            <div class="eyebrow">管理控制台导航</div>
            <h1>官方管理面板 + 日志检索</h1>
            <p class="copy">
                保留官方管理界面作为主入口，同时插入一个单独的日志检索页。日志页复用同域本地存储中的 Management Key，
                适合排查 `usage_limit_reached`、`refresh_token_reused`、`token_invalidated` 这类认证与配额问题。
            </p>
        </section>

        <section class="frame-shell">
            <div class="toolbar">
                <div class="tabs">
                    <button class="tab" data-tab="official" type="button">官方管理面板</button>
                    <button class="tab" data-tab="logs" type="button">日志检索</button>
                </div>
                <div class="hint" id="tabHint">当前正在加载官方管理面板。</div>
            </div>
            <iframe id="panelFrame" title="CLIProxyAPI Management"></iframe>
        </section>
    </div>

    <script>
        const tabs = {
            official: {
                label: "官方管理面板",
                hint: "当前正在加载官方管理面板。",
                src: "/management.html?external=1",
            },
            logs: {
                label: "日志检索",
                hint: "当前正在加载内置日志检索页。",
                src: "/management-logs.html",
            },
        };

        const frame = document.getElementById("panelFrame");
        const tabHint = document.getElementById("tabHint");
        const buttons = Array.from(document.querySelectorAll(".tab"));

        function currentTab() {
            const params = new URLSearchParams(window.location.search);
            const tab = (params.get("tab") || "").trim().toLowerCase();
            return Object.prototype.hasOwnProperty.call(tabs, tab) ? tab : "official";
        }

        function applyTab(tab, replaceHistory) {
            const entry = tabs[tab] || tabs.official;
            frame.src = entry.src;
            tabHint.textContent = entry.hint;
            buttons.forEach((button) => {
                button.classList.toggle("active", button.dataset.tab === tab);
            });
            if (replaceHistory) {
                const next = new URL(window.location.href);
                next.searchParams.set("tab", tab);
                window.history.replaceState({}, "", next.toString());
            }
        }

        buttons.forEach((button) => {
            button.addEventListener("click", () => {
                applyTab(button.dataset.tab || "official", true);
            });
        });

        applyTab(currentTab(), false);
    </script>
</body>
</html>
